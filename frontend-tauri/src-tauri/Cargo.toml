[package]
name = "fluxora_tauri"
version = "0.0.0"
description = "Fluxora Tauri shell"
authors = ["Fluxora"]
edition = "2021"
default-run = "fluxora_tauri"

[lib]
name = "fluxora_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fluxora-ai-host"
path = "src/bin/fluxora_ai_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
notify-debouncer-full = "0.8.0-rc.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time"] }
